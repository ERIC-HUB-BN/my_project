version: '3.8'

services:
  # --- 您原本的 Python App 服務 ---
  app:
    build: .
    container_name: my_python_app
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      - ENV=production
      # --- 修改 depends_on ---
      # 讓 app 依賴 redis 和 rabbitmq
      - REDIS_URL=redis://redis:6379 # 指定容器內連線位址
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq/ # 指定容器內連線位址
    depends_on:
      - redis
      - rabbitmq # <<< --- 新增依賴 ---

  # --- Redis 服務 (保持不變) ---
  redis:
    image: "redis:alpine"
    container_name: my_redis_container
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: always

  # --- 新增的 RabbitMQ 服務 ---
  rabbitmq:
    # 使用帶有管理介面的官方映像檔
    image: "rabbitmq:3-management-alpine"
    container_name: my_rabbitmq_container # 容器名稱
    ports:
      # 5672 是 RabbitMQ AMQP 協議的主要端口
      - "5672:5672"
      # 15672 是 RabbitMQ 管理介面的 Web 端口
      - "15672:15672"
    volumes:
      # 將 RabbitMQ 的數據持久化 (可選)
      - rabbitmq_data:/var/lib/rabbitmq
    # RabbitMQ 預設的 guest/guest 帳密通常夠開發用
    # environment:
    #   - RABBITMQ_DEFAULT_USER=user
    #   - RABBITMQ_DEFAULT_PASS=password
    restart: always

# --- volumes 區塊更新 ---
volumes:
  redis_data:
    driver: local
  rabbitmq_data: # <<< --- 新增 RabbitMQ 的 volume ---
    driver: local