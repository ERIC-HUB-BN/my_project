version: '3.8' # 指定 compose 文件版本

services:
  # --- 您原本的 Python App 服務 ---
  app:
    build: . # 根據當前目錄的 Dockerfile 建立映像檔
    container_name: my_python_app # 容器名稱
    volumes:
      - .:/app # 將目前目錄掛載到容器的 /app 路徑 (方便修改程式碼不用重bild)
    ports:
      - "8000:8000" # 映射端口 (如果您的 app 需要的話)
    environment:
      - ENV=production # 設定環境變數
    # --- 新增 ---
    # 讓 app 服務在 redis 服務啟動後再啟動 (比較保險)
    depends_on:
      - redis

  # --- 我們新增的 Redis 服務 ---
  redis:
    image: "redis:alpine" # 使用 Redis 的官方 Docker 映像檔 (alpine 版本比較小)
    container_name: my_redis_container # 給這個 Redis 貨櫃取個名字
    ports:
      # 把我們電腦的 6379 port 連接到 Redis 貨櫃的 6379 port
      - "6379:6379"
    volumes:
      # 把 Redis 的數據存到本機磁碟的 redis_data 儲存區
      - redis_data:/data
    restart: always # 自動重啟

# --- 這個 volumes 區塊要放在最外層，跟 services 同級 ---
volumes:
  redis_data:
    driver: local # 使用本地磁碟驅動